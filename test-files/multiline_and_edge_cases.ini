; Tests multiline continuation, empty values, and mixed inline comments

[service]
name = worker-daemon
description = Background indexing service
  responsible for ingesting INI files
  and sorting key pairs
threads = 4

[flags]
debug_mode = true
enable_telemetry = false
optional_secret = 
allowed_origins = http://localhost, http://127.0.0.1 ; comma-separated list

[endpoints]
health_check = /healthz # internal monitoring probe
metrics = /metrics
api_v1 = /api/v1 ; legacy support
